name: Release

# Pushing a version tag is the ONLY thing that creates a release:
#   git tag v0.2.0 && git push origin v0.2.0          stable release
#   git tag v0.2.0-rc.1 && git push origin v0.2.0-rc.1   pre-release (-alpha. / -beta. / -rc.)
# Merging to main runs the tests (test.yml) and nothing else.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.extract.outputs.tag_name }}
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check the version
        id: extract
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $TAG_NAME (want vX.Y.Z or vX.Y.Z-alpha.N / -beta.N / -rc.N)" >&2; exit 1
          fi
          # The tag is the only place the version is set: the repository reads 0.0.0-dev, and each build stamps this one in.
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "is_prerelease=true" >> "$GITHUB_OUTPUT"; else echo "is_prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Test
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  build:
    name: Build ${{ matrix.target }}
    needs: [validate-tag, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
          - { os: ubuntu-latest, target: windows-x64, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Stamp the tag's version into the source (the guides embedded in the binary carry it)
        run: bun scripts/stamp-version.mjs "${{ needs.validate-tag.outputs.version }}"
      - name: Compile a standalone binary
        run: >-
          bun build --compile --minify --target=bun-${{ matrix.target }}
          --define 'ROUTR_BUILD_VERSION="${{ needs.validate-tag.outputs.version }}"'
          src/routr.mjs --outfile routr-${{ matrix.target }}${{ matrix.ext }}
      - name: Smoke-test the binary this runner can execute
        if: matrix.target == 'linux-x64'
        run: |
          test "$(./routr-${{ matrix.target }} --version)" = "${{ needs.validate-tag.outputs.version }}"
          ./routr-${{ matrix.target }} skill install --dry-run
          # The skill it installs must name the same release, or doctor tells every user to reinstall it.
          H="$(mktemp -d)"; HOME="$H" ./routr-${{ matrix.target }} skill install >/dev/null
          V="${{ needs.validate-tag.outputs.version }}"; grep -q "version: \"${V%%-*}\"" "$H/.agents/skills/routr/SKILL.md"
      - uses: actions/upload-artifact@v4
        with:
          name: routr-${{ matrix.target }}
          path: routr-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  # macOS binaries are built on macOS, signed with the maintainer's Developer ID under the hardened runtime, and
  # notarized by Apple. An ad-hoc signature is not enough: macOS updates have started killing ad-hoc binaries
  # (cs_invalid_page, seen on a sibling project's linker-signed binary, 2026-09-28), and Gatekeeper refuses one that a
  # browser downloaded. Only this job sees the signing secrets: they live in the `release` environment, which only a
  # `v*` tag can use. A release never ships an unsigned or ad-hoc macOS binary: missing secrets fail it.
  build-macos:
    name: Build ${{ matrix.target }} (signed, notarized)
    needs: [validate-tag, test]
    environment: release
    strategy:
      fail-fast: true
      matrix:
        target: [darwin-arm64, darwin-x64]
    runs-on: macos-latest
    env:
      BIN: routr-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Stamp the tag's version into the source (the guides embedded in the binary carry it)
        run: bun scripts/stamp-version.mjs "${{ needs.validate-tag.outputs.version }}"
      - name: Compile a standalone binary
        run: >-
          bun build --compile --minify --target=bun-${{ matrix.target }}
          --define 'ROUTR_BUILD_VERSION="${{ needs.validate-tag.outputs.version }}"'
          src/routr.mjs --outfile "$BIN"
      - name: Sign with Developer ID (hardened runtime)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_TEAM_ID; do
            [ -n "${!v}" ] || { echo "$v is not set in the release environment: refusing to ship an unsigned macOS binary" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/routr-signing.keychain-db"
          # A keychain of its own, in the search list (or the intermediate is not found and the chain does not build),
          # with codesign: in the key's partition list (without it codesign fails with errSecInternalComponent).
          KP="$(openssl rand -hex 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          printf %s "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # one word per keychain the runner already searches
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # The identity by its hash, and only the one for this team.
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -v t="($MACOS_TEAM_ID)" 'index($0, "Developer ID Application:") && index($0, t) { print $2; exit }')"
          [ -n "$ID" ] || { echo "no Developer ID Application identity for team $MACOS_TEAM_ID in the certificate" >&2; exit 1; }
          codesign --force --sign "$ID" --keychain "$KEYCHAIN" --options runtime --timestamp \
            --identifier co.goondocks.routr --entitlements .github/macos-entitlements.plist "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dv --verbose=2 "$BIN" 2>&1 | tee "$RUNNER_TEMP/sig.txt"
          grep -qx "TeamIdentifier=$MACOS_TEAM_ID" "$RUNNER_TEMP/sig.txt"
          grep -qx "Identifier=co.goondocks.routr" "$RUNNER_TEMP/sig.txt"
          grep -q "flags=0x10000(runtime)" "$RUNNER_TEMP/sig.txt"
          grep -q "^Timestamp=" "$RUNNER_TEMP/sig.txt"
      - name: Smoke-test the signed binary under the hardened runtime
        if: matrix.target == 'darwin-arm64'
        run: |
          test "$(./"$BIN" --version)" = "${{ needs.validate-tag.outputs.version }}"
          ./"$BIN" skill install --dry-run
          # The skill it installs must name the same release, or doctor tells every user to reinstall it.
          H="$(mktemp -d)"; HOME="$H" ./"$BIN" skill install >/dev/null
          V="${{ needs.validate-tag.outputs.version }}"; grep -q "version: \"${V%%-*}\"" "$H/.agents/skills/routr/SKILL.md"
      - name: Notarize with Apple
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "$v is not set in the release environment: refusing to ship an unnotarized macOS binary" >&2; exit 1; }
          done
          KEY="$RUNNER_TEMP/notary.p8"
          printf %s "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY"
          auth=(--key "$KEY" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID")
          # A bare binary is sent in a zip; notarizing does not change it, so SHA256SUMS still matches what ships.
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/$BIN.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$BIN.zip" "${auth[@]}" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          SUB="$(jq -r .id "$RUNNER_TEMP/notary.json")"; STATUS="$(jq -r .status "$RUNNER_TEMP/notary.json")"
          xcrun notarytool log "$SUB" "${auth[@]}" "$RUNNER_TEMP/notary-log.json" || true
          cat "$RUNNER_TEMP/notary-log.json" 2>/dev/null || true
          rm -f "$KEY"
          [ "$STATUS" = "Accepted" ] || { echo "notarization: $STATUS" >&2; exit 1; }
      # Required for a release; a pre-release reports it and carries on, so one can be downloaded and looked at.
      - name: Check Gatekeeper accepts a downloaded copy
        continue-on-error: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
        run: |
          set -euo pipefail
          # A bare binary cannot carry its ticket (no stapling): Gatekeeper fetches it from Apple by the code hash.
          # Wait until Apple publishes it, then assess a copy marked as a browser download, as a person's would be.
          CDHASH="$(codesign -dvvv "$BIN" 2>&1 | sed -n 's/^CDHash=//p')"
          for i in $(seq 1 30); do
            if curl -fsS -X POST https://api.apple-cloudkit.com/database/1/com.apple.gk.ticket-delivery/production/public/records/lookup \
                 -H 'Content-Type: application/json' -d "{\"records\":[{\"recordName\":\"2/2/$CDHASH\"}]}" \
               | jq -e '.records[0].fields.signedTicket' >/dev/null; then echo "ticket published for $CDHASH"; break; fi
            [ "$i" = 30 ] && { echo "Apple has not published the ticket for $CDHASH after 5 minutes" >&2; exit 1; }
            sleep 10
          done
          cp "$BIN" "$RUNNER_TEMP/downloaded"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$RUNNER_TEMP/downloaded"
          spctl --assess --type install -vv "$RUNNER_TEMP/downloaded" 2>&1 | tee "$RUNNER_TEMP/gk.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/gk.txt"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/routr-signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  # The Windows binary is cross-compiled on Linux, where it cannot run. Run it on Windows before anything is published.
  smoke-windows:
    name: Smoke-test the Windows binary
    needs: [validate-tag, build]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: routr-windows-x64
      - shell: pwsh
        run: |
          $v = & .\routr-windows-x64.exe --version
          if ($v -ne "${{ needs.validate-tag.outputs.version }}") { throw "routr --version said '$v'" }
          & .\routr-windows-x64.exe skill install --dry-run
          if ($LASTEXITCODE -ne 0) { throw "skill install --dry-run failed" }

  github-release:
    name: GitHub release
    needs: [validate-tag, build, build-macos, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        run: cd release-files && sha256sum routr-* > SHA256SUMS && cat SHA256SUMS

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # Semver-aware tag sort: a bare version ranks above its own pre-releases.
          SORT_FLAGS=(-c versionsort.suffix=-alpha -c versionsort.suffix=-beta -c versionsort.suffix=-rc)
          # A stable release is compared with the last STABLE tag, so 0.2.0's notes cover everything since 0.1.0,
          # not just since 0.2.0-rc.3. A pre-release is compared with the most recent tag of any kind.
          if [ "$IS_PRERELEASE" = "true" ]; then
            PREVIOUS_TAG=$(git "${SORT_FLAGS[@]}" tag --list 'v*' --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -1 || true)
          else
            PREVIOUS_TAG=$(git "${SORT_FLAGS[@]}" tag --list 'v*' --sort=-version:refname | grep -Fxv "$TAG_NAME" | grep -Ev -- '-(alpha|beta|rc)' | head -1 || true)
          fi
          # `git log -n` rather than `| head`: with pipefail, head closing the pipe fails the step.
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log -n 50 "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
            COMMIT_COUNT=$(git log "${PREVIOUS_TAG}..HEAD" --oneline --no-merges | wc -l | tr -d ' ')
            RANGE_BLURB="${COMMIT_COUNT} commits since ${PREVIOUS_TAG}"
          else
            COMMITS=$(git log -n 20 --pretty=format:"- %s" --no-merges)
            RANGE_BLURB="initial release"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            TITLE="routr ${VERSION} · Pre-release"
            HEADER="${RANGE_BLURB} · **Pre-release**"$'\n\n'"> Pre-release. May contain bugs or incomplete features. The install scripts only pick it up when you name the version."
            INSTALL_SH="curl -fsSL https://raw.githubusercontent.com/sirkirby/routr/main/install.sh | ROUTR_VERSION=${VERSION} sh"
            INSTALL_PS="\$env:ROUTR_VERSION='${VERSION}'; irm https://raw.githubusercontent.com/sirkirby/routr/main/install.ps1 | iex"
          else
            TITLE="routr ${VERSION}"
            HEADER="${RANGE_BLURB}"
            INSTALL_SH="curl -fsSL https://raw.githubusercontent.com/sirkirby/routr/main/install.sh | sh"
            INSTALL_PS="irm https://raw.githubusercontent.com/sirkirby/routr/main/install.ps1 | iex"
          fi

          {
            echo "${HEADER}"
            echo
            echo "## Install / Upgrade"
            echo
            echo '```bash'
            echo "${INSTALL_SH}     # macOS, Linux"
            echo '```'
            echo '```powershell'
            echo "${INSTALL_PS}     # Windows"
            echo '```'
            echo
            echo "The same command upgrades an existing install. One standalone binary; no Node or Bun needed. Checksums are in \`SHA256SUMS\`."
            echo
            echo "## What's Changed"
            echo
            echo "${COMMITS}"
          } > release-notes.md
          cat release-notes.md
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          flags=(--title "$RELEASE_TITLE" --notes-file release-notes.md)
          if [ "$IS_PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          # Re-running the workflow for the same tag updates the release instead of failing.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${flags[@]}"
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" release-files/* "${flags[@]}"
          fi
