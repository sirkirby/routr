name: Share your ledger
description: Contribute your routr outcomes so the questions can be tuned on real work
title: "Ledger: <your setup in a few words>"
labels: ["ledger"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. routr's questions are kept or dropped on real outcomes, and yours help.

        Run `routr share`, read the file it writes, and attach it below. It holds what routr read from each brief
        (yes/no probabilities and a level), the level and subscription chosen, the outcome, and the attempt count.
        It holds **no** briefs, hashes, notes, ids, or usage numbers, and no model names unless you passed
        `--with-models`. Issues are public, so please do not add anything about the work itself.
  - type: textarea
    id: file
    attributes:
      label: The file from `routr share`
      description: Drag the `.jsonl` file here, or paste its contents.
    validations:
      required: true
  - type: checkboxes
    id: harnesses
    attributes:
      label: Harnesses you ran workers on
      options:
        - label: Claude Code
        - label: Codex
        - label: Cursor
        - label: Antigravity
  - type: textarea
    id: surprises
    attributes:
      label: Where did routr's advice surprise you?
      description: Optional. In general terms only, for example "it called reviews of generated code basic, and they kept needing rework".
